<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { fill: #8b949e; font-size: 11px; font-weight: 500; }
    .node { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .node-text { fill: #e6edf3; font-size: 10px; font-weight: 600; }
    .arrow-line { stroke: #238636; stroke-width: 1.8; }
    .arrow-head { fill: #238636; }
    .arrow-line-blue { stroke: #1f6feb; stroke-width: 1.8; }
    .arrow-head-blue { fill: #1f6feb; }
    .center-dot { fill: #238636; }
    .op-label { font-size: 9.5px; font-weight: 500; letter-spacing: 0.5px; }
    .op-green { fill: #3fb950; }
    .op-blue { fill: #58a6ff; }
  </style>

  <!-- Background -->
  <rect width="480" height="280" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="240" y="28" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Git Workflow</text>

  <!-- Center dot -->
  <circle cx="240" cy="150" r="5" class="center-dot" opacity="0.3"/>

  <!-- TOP: Commit (pointing up) -->
  <line x1="240" y1="140" x2="240" y2="68" class="arrow-line"/>
  <polygon points="240,58 235,68 245,68" class="arrow-head"/>
  <rect x="200" y="40" width="80" height="26" rx="6" class="node"/>
  <text x="240" y="57" text-anchor="middle" class="node-text">COMMIT</text>
  <text x="258" y="80" class="label op-label op-green">git commit</text>

  <!-- RIGHT: Push (pointing right) -->
  <line x1="250" y1="150" x2="352" y2="150" class="arrow-line"/>
  <polygon points="362,150 352,145 352,155" class="arrow-head"/>
  <rect x="366" y="137" width="72" height="26" rx="6" class="node"/>
  <text x="402" y="154" text-anchor="middle" class="node-text">PUSH</text>
  <text x="320" y="142" text-anchor="middle" class="label op-label op-green">git push</text>

  <!-- BOTTOM: Merge (pointing down) -->
  <line x1="240" y1="160" x2="240" y2="222" class="arrow-line-blue"/>
  <polygon points="240,232 235,222 245,222" class="arrow-head-blue"/>
  <rect x="200" y="234" width="80" height="26" rx="6" class="node"/>
  <text x="240" y="251" text-anchor="middle" class="node-text">MERGE</text>
  <text x="258" y="218" class="label op-label op-blue">git merge</text>

  <!-- LEFT: Pull (pointing left) -->
  <line x1="230" y1="150" x2="128" y2="150" class="arrow-line-blue"/>
  <polygon points="118,150 128,145 128,155" class="arrow-head-blue"/>
  <rect x="42" y="137" width="72" height="26" rx="6" class="node"/>
  <text x="78" y="154" text-anchor="middle" class="node-text">PULL</text>
  <text x="160" y="142" text-anchor="middle" class="label op-label op-blue">git pull</text>

  <!-- Diagonal guide lines (subtle) -->
  <line x1="240" y1="58" x2="366" y2="150" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="366" y1="150" x2="240" y2="232" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="240" y1="232" x2="114" y2="150" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="114" y1="150" x2="240" y2="58" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

</svg>
